<!DOCTYPE html>
<html>
<head>
    <title>Detail Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f8fbff;
            color: #1f2937;
        }

        header {
            background-color: #eaf2ff;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: inline-block;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #2563eb;
            margin-top: 0;
        }

        .meta {
            color: #4b5563;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .button.secondary {
            background-color: #edf4ff;
            color: #1d4ed8;
            margin-left: 10px;
        }

        ol {
            padding-left: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span class="logo" aria-label="Logo Belajaryuk"></span>
            <h2>Belajaryuk</h2>
        </div>
        <nav>
            <a href="index.html">Beranda</a>
            <a href="#">Tentang</a>
        </nav>
    </header>

    <main class="container">
        <h1 id="site-title">Judul Website</h1>
        <p class="meta" id="site-description">Deskripsi website.</p>

        <h2>Cara Penggunaan</h2>
        <ol id="site-steps"></ol>

        <a id="site-link" href="#" class="button" target="_blank" rel="noreferrer">Kunjungi Website</a>
        <a href="index.html" class="button secondary">Kembali</a>
    </main>

            {

        ];

        const params = new URLSearchParams(window.location.search);
        const siteId = params.get('id') || '1';
        const site = sites.find(item => item.id === siteId) || sites[0];

        document.getElementById('site-title').textContent = site.title;
        document.getElementById('site-description').textContent = site.description;

        const stepsList = document.getElementById('site-steps');
        site.steps.forEach(step => {
            const item = document.createElement('li');
            item.textContent = step;
            stepsList.appendChild(item);
        });

        const siteLink = document.getElementById('site-link');
        siteLink.href = site.url;
    </script>
</body>
</html>
