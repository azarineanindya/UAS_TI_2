    <style>
        @view-transition {
            navigation: auto;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fbffc7;
            background-image: url("assets/images/background-reference.jpg");
            background-position: center top;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #1f2937;
        }

        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 220ms;
        }

        ::view-transition-old(root) {
            animation-name: page-fade-out;
        }

        ::view-transition-new(root) {
            animation-name: page-fade-in;
        }

        @keyframes page-fade-out {
            to {
                opacity: 0;
                transform: translateY(-6px);
            }
        }

        @keyframes page-fade-in {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
        }

        header {
            background-color: transparent;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ff1fa9;
            text-decoration: none;
            cursor: pointer;
        }

        .brand:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 4px;
            border-radius: 6px;
        }

        .logo {
            width: 60px;
            height: 60px;
            display: block;
            border-radius: 50%;
            object-fit: contain;
        }

        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #ff1fa9;
            transition: color 180ms ease;
        }

        nav a:hover {
            color: #ff1fa9;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.04);
        }

        h1 {
            color: #2563eb;
            margin-top: 0;
        }

        .meta {
            color: #4b5563;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            background-color: #ff1fa9;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 10px;
            margin-top: 10px;
            transition: transform 160ms ease, background-color 160ms ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: scale(0.96);
        }

        .button.secondary {
            background-color: #ff97d5;
            color: #501236;
            margin-left: 10px;
        }

        #back-link {
            background-color: #2563eb;
            color: #fbffc7;
        }

        #back-link:hover {
            background-color: #1d4ed8;
        }

        ol,
        ul {
            padding-left: 20px;
            line-height: 1.8;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

            {
                id: 'ai-9',

                    'Melihat hasil dan perkembangan belajar.'
                ]
            },
            {
                id: 'ai-10',
                title: '✨ Gemini',
                description: 'Asisten AI dari Google untuk membantu memahami materi, mencari ide, dan membuat berbagai konten.',

                steps: [
                    'Menjelaskan topik dan menjawab pertanyaan belajar.',
                    'Meringkas teks dan membantu memahami dokumen.',

                ]

        ];

        const params = new URLSearchParams(window.location.search);
        const siteId = params.get('id') || '1';
        const site = sites.find(item => item.id === siteId) || sites[0];

        document.getElementById('site-title').textContent = site.title;
        document.getElementById('site-description').textContent = site.description;

        const isAiTool = site.id.startsWith('ai-');
        document.getElementById('site-section-title').textContent = isAiTool
            ? 'Yang Bisa Dilakukan'
            : 'Cara Penggunaan';

        const backLink = document.getElementById('back-link');
        if (isAiTool) {
            backLink.href = 'ai.html';
            backLink.textContent = 'Kembali';
        }

        const stepsList = document.getElementById('site-steps');
        if (isAiTool) {
            const featuresList = document.createElement('ul');
            featuresList.id = stepsList.id;
            stepsList.replaceWith(featuresList);
        }

        const instructionsList = document.getElementById('site-steps');
        site.steps.forEach(step => {
            const item = document.createElement('li');
            item.textContent = step;
            instructionsList.appendChild(item);
        });

        const siteLink = document.getElementById('site-link');
        siteLink.href = site.url;

    <script src="assets/js/home-interactions.js" defer></script>
